[package]
name = "proto-b-wasm-host"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone: keep cargo from attaching this to the root workspace.
[workspace]

[dependencies]
wasmtime = "47.0.4"
wasmtime-wasi = "47.0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
