[workspace]
resolver = "3"
members = ["crates/*"]
# Phase 0 spike code is throwaway and must never be built with the workspace.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Minimum supported Rust version. Must match rust-toolchain.toml when bumped.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rndubs/grist-agent"
publish = false

[workspace.dependencies]
# In-repo crates. `kernel` depends on nothing in this list (see crates/README.md).
kernel = { path = "crates/kernel" }
providers = { path = "crates/providers" }
host = { path = "crates/host" }
ext = { path = "crates/ext" }
profiles = { path = "crates/profiles" }
sandbox = { path = "crates/sandbox" }
orchestrator = { path = "crates/orchestrator" }
provenance = { path = "crates/provenance" }
evolve = { path = "crates/evolve" }

# Third-party dependencies shared across crates. Versions are pinned here once.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["compat"] }
blake3 = "1"
futures-core = "0.3"
regex = "1"
# RFC 8785 number formatting (ECMAScript Number::toString) for the in-crate canonicalizer.
ryu-js = "1"
uuid = { version = "1", features = ["v7"] }
rand = "0.9"
toml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
bytes = "1"
tempfile = "3"
nix = { version = "0.29", features = ["signal", "process"] }
base64 = "0.22"
proptest = "1"
# ADR-0004: the Agent Client Protocol SDK (v1 on by default; ACP v2 is behind its `unstable_protocol_v2` feature).
agent-client-protocol = "2.1.0"
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
